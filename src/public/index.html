<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mailbug</title>
    <link rel="icon" href="/assets/mailbug.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Genos:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="wordmark">
      <img src="/assets/mailbug.png" alt="" />
      <h1>Mailbug</h1>
    </header>

    <section class="frame rail" id="rail" aria-label="Widgets">
      <div class="calendar" id="calendar"></div>
      <div class="divider"></div>
      <div class="codes" id="codes"></div>
      <div class="slot-fill">widgets go here</div>
    </section>

    <section class="frame" aria-label="Inbox">
      <div class="inbox-controls">
        <span class="count" id="count"></span>

        <label class="control" for="filter">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 5h18l-7 8v6l-4 2v-8z" />
          </svg>
          <select id="filter" aria-label="Filter by category">
            <option value="">all</option>
          </select>
        </label>

        <label class="control" for="sort">
          <select id="sort" aria-label="Sort by">
            <option value="priority">pri</option>
            <option value="received_at">date</option>
            <option value="from_address">sender</option>
            <option value="category">category</option>
          </select>
        </label>

        <button
          class="ghost-button"
          id="order"
          type="button"
          aria-label="Toggle sort direction"
        >
          ↓
        </button>
      </div>

      <div class="rows" id="rows"></div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
